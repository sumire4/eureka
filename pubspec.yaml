name: eureka
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # iOS İkonları
  cupertino_icons: ^1.0.8

  # Ağ & RSS Parsing
  http: ^1.2.2
  xml: ^6.5.0

  share_plus:
  # Firebase Servisleri
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Google Gemini AI SDK
  google_generative_ai: ^0.4.6

  # Safari / Tarayıcı görünümü (Haber linkleri için)
  url_launcher: ^6.3.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - .env