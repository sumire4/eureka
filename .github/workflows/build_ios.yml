name: Build & Sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID (E-posta)'
        required: true
      apple_password:
        description: 'Apple ID Parolası'
        required: true
      device_udid:
        description: 'iPhone UDID Numarası'
        required: true

jobs:
  build-and-sign:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Fastlane & Development Certificate
        env:
          FASTLANE_USER: ${{ github.event.inputs.apple_id }}
          FASTLANE_PASSWORD: ${{ github.event.inputs.apple_password }}
        run: |
          # Keychain oluştur
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Fastlane sigh ile profili indir / oluştur
          bundle exec fastlane sigh development \
            --username "${{ github.event.inputs.apple_id }}" \
            --app_identifier "com.mete.eurekaapp" \
            --force \
            --ignore_profiles \
            || true

      - name: Build and Sign via Xcode
        run: |
          cd ios
          # Runner projesini derle
          flutter build ios --release --no-codesign
          cd ..

      - name: Install zsign tool
        run: brew install zsign

      - name: Sign IPA with Downloaded Profile
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Unsigned.ipa Payload

          # İndirilen provisioning profilini bul
          PROV_PROFILE=$(find . -name "*.mobileprovision" | head -n 1)

          if [ -n "$PROV_PROFILE" ]; then
            echo "Profil bulundu: $PROV_PROFILE"
            zsign -m "$PROV_PROFILE" -o Eureka-Signed.ipa Unsigned.ipa
          else
            echo "Profil doğrudan indirilemedi, Ad-Hoc imzalanıyor..."
            zsign -o Eureka-Signed.ipa Unsigned.ipa
          fi

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Eureka-iOS-Signed
          path: Eureka-Signed.ipa
          retention-days: 7