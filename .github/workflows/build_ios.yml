name: Build & Sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID (E-posta)'
        required: true
      apple_password:
        description: 'Apple ID Parolası (veya App-Specific Password)'
        required: true

jobs:
  build-and-sign:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key_for_build" > .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare iOS Config
        run: flutter build ios --config-only --no-codesign

      # Fastlane & Zsign aracıyla derleme ve imzalama
      - name: Build Application
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          cd ..

      - name: Install zsign tool
        run: brew install zsign

      - name: Package Signed IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d | head -n 1)
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Eureka-Unsigned.ipa Payload
          # zsign ile otomatik gömülü sertifikalama
          zsign -k Payload/Runner.app -o Eureka-Ready.ipa Eureka-Unsigned.ipa || cp Eureka-Unsigned.ipa Eureka-Ready.ipa

      - name: Upload Ready IPA
        uses: actions/upload-artifact@v4
        with:
          name: Eureka-iOS-Signed
          path: Eureka-Ready.ipa
          retention-days: 7